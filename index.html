
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xin chao Ca Lop</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      max-width: 680px;
      width: 90%;
      padding: 40px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 { font-size: 2rem; margin-bottom: 12px; color: #ffffff; }
    p { line-height: 1.6; color: #cbd5e1; margin-bottom: 20px; }
    .version-box {
      padding: 14px;
      background: #1e293b;
      border-left: 4px solid #22c55e;
      border-radius: 8px;
      font-weight: 600;
      color: #4ade80;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Nhóm 14</span>
    <h1>Xin chào! Đây là website của Nhóm 14</h1>
    <p>Hệ thống lưu trữ mã nguồn trên GitHub</p>
    <div class="version-box">
      <h1>Trần Trương Hoàng Nhân</h1>
    <h1>Vo Duy Quốc </h1>
    <h1>Phạm Thị Thùy</h1>
    <h1>Nguyễn Thanh Nhất</h1>
    <h1>Trần Mạnh Tuấn</h1>
    </div>
  </div>
</body>
</html>
